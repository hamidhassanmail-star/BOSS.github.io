name: Add globe to location

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-globe:
    if: "!contains(github.event.head_commit.message, '[globe-auto]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert globe below location
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="hh-globe"' not in s:
              globe = '''<div id="hh-globe" style="margin:28px auto 8px;max-width:520px;text-align:center;padding:28px 18px;border:2px solid #ffd70077;border-radius:30px;background:radial-gradient(circle at 50% 35%,#ff650022,transparent 58%),linear-gradient(135deg,#07101f,#12051b);box-shadow:0 18px 45px #0009;overflow:hidden;position:relative"><div style="font-size:76px;line-height:1;display:inline-block;animation:hhGlobeSpin 9s linear infinite;filter:drop-shadow(0 0 18px #00cfff99)">🌍</div><div style="margin-top:14px;font-size:20px;font-weight:1000;letter-spacing:2px;color:#ffd700">🌍 OUR WORLD • SRI LANKA</div><div style="margin-top:7px;color:#c9d1df;font-weight:800">BALANGODA • SRI LANKA 🇱🇰</div><style>@keyframes hhGlobeSpin{0%{transform:rotateY(0deg) rotateZ(-2deg)}50%{transform:rotateY(180deg) rotateZ(2deg)}100%{transform:rotateY(360deg) rotateZ(-2deg)}}@media(max-width:520px){#hh-globe{margin-top:22px;padding:22px 12px}#hh-globe>div:first-child{font-size:62px}}</style></div>'''
              marker = '</section></main>'
              if marker not in s:
                  raise SystemExit('Homepage closing marker not found')
              s = s.rsplit(marker, 1)[0] + globe + marker + s.rsplit(marker, 1)[1]
              p.write_text(s, encoding='utf-8')
          else:
              print('Globe already present')
          PY

      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-globe.yml
          if git diff --cached --quiet; then exit 0; fi
          git rm -f .github/workflows/add-globe.yml
          git add index.html
          git commit -m "Add animated globe below location [globe-auto]"
          git push