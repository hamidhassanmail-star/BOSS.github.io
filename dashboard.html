<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAMID HASSAN • Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;background:#05050b;color:#fff}.nav{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;background:#0a0913;border-bottom:1px solid #ffd70066}.logo{font-size:24px;font-weight:900;color:#ffd700}.logout{padding:10px 18px;border:1px solid #ffd700;border-radius:20px;background:transparent;color:#ffd700;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:45px 6%}.hero{padding:30px;border-radius:25px;background:linear-gradient(135deg,#ff260022,#ffd00018,#7c4dff22);border:1px solid #ffd70044}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}.card{padding:24px;border-radius:22px;background:#11101c;border:1px solid #ffffff18}.card h2{color:#ffd700}.card button{padding:11px 15px;border:0;border-radius:15px;background:linear-gradient(90deg,#ff2600,#ffd000);font-weight:900;cursor:pointer}input{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;background:#080812;border:1px solid #ffffff22;border-radius:10px;color:white}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><div class="logo">👑 HAMID HASSAN • DASHBOARD</div><button class="logout" onclick="logout()">Sign Out</button></nav><main class="wrap"><section class="hero"><h1 id="welcome">Welcome!</h1><p>Manage your website content from here.</p></section><div class="grid"><div class="card"><h2>📺 Videos</h2><p>Add or update video links.</p><input placeholder="YouTube video URL"><button onclick="alert('Video form ready — connect a database/backend to save it online.')">Add Video</button></div><div class="card"><h2>📚 Playlists</h2><p>Add playlist links.</p><input placeholder="Playlist URL"><button onclick="alert('Playlist form ready — connect a database/backend to save it online.')">Add Playlist</button></div><div class="card"><h2>🖼️ Images</h2><p>Manage image links.</p><input placeholder="Image URL"><button onclick="alert('Image form ready — connect a database/backend to save it online.')">Add Image</button></div><div class="card"><h2>🔗 Links</h2><p>Add useful hyperlinks.</p><input placeholder="Link URL"><button onclick="alert('Link form ready — connect a database/backend to save it online.')">Add Link</button></div><div class="card"><h2>⚙️ Account</h2><p id="account"></p><button onclick="location.href='index.html'">View Website</button></div></div></main><script>
const SUPABASE_URL='YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
const configured=SUPABASE_URL.startsWith('https://')&&SUPABASE_ANON_KEY.length>20;
const user=JSON.parse(localStorage.getItem('hh_user')||'null');
let sb=null;

async function init(){
 if(configured){
   sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
   const {data}=await sb.auth.getSession();
   if(data.session){
     const u=data.session.user;
     const name=u.user_metadata?.full_name||u.user_metadata?.name||u.email?.split('@')[0]||'Viewer';
     localStorage.setItem('hh_user',JSON.stringify({email:u.email,name,provider:'supabase'}));
     document.getElementById('welcome').textContent='Welcome, '+name+' 👑';
     document.getElementById('account').textContent=u.email||'';
     return;
   }
   location.href='auth.html';
   return;
 }
 if(!user){location.href='auth.html';return}
 document.getElementById('welcome').textContent='Welcome, '+(user.name||'Viewer')+' 👑';
 document.getElementById('account').textContent=user.email||'';
}
async function logout(){
 if(sb) await sb.auth.signOut();
 localStorage.removeItem('hh_user');
 location.href='auth.html';
}
init();
</script></body></html>
