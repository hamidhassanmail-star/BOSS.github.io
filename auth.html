<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAMID HASSAN • Sign In</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial;background:radial-gradient(circle at 20% 20%,#ff3d00,#16000b 38%,#05050b 75%);color:#fff}.box{width:min(430px,90%);padding:35px;border:1px solid #ffd70088;border-radius:28px;background:#080812ee;box-shadow:0 20px 70px #000}.logo{text-align:center;font-size:28px;font-weight:900;color:#ffd700}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button,.submit,.back{flex:1;padding:12px;border-radius:12px;border:1px solid #ffd70066;background:#151522;color:#fff;font-weight:800;cursor:pointer}.tabs .active,.submit{background:linear-gradient(90deg,#ff2600,#ff7a00,#ffd000);color:#160000;border:0}input{width:100%;padding:13px;margin:7px 0 12px;border-radius:12px;border:1px solid #ffffff22;background:#11111d;color:#fff;box-sizing:border-box}small{color:#aaa}.error{color:#ff8d8d;min-height:20px}.hide{display:none}.back{display:block;text-align:center;margin-top:12px;text-decoration:none}</style></head><body><div class="box"><div class="logo">👑 HAMID HASSAN</div><div class="tabs"><button id="siTab" class="active">Sign In</button><button id="suTab">Sign Up</button></div><form id="form"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password"><div id="nameWrap" class="hide"><label>Name</label><input id="name" type="text" autocomplete="name"></div><div id="msg" class="error"></div><button class="submit" type="submit" id="submit">SIGN IN</button></form><a class="back" href="index.html">← Back to website</a><small>For a real production website, connect this page to a proper authentication service. This GitHub Pages version stores demo accounts only in this browser.</small></div><script>let signup=false;const $=id=>document.getElementById(id);function mode(v){signup=v;$('siTab').classList.toggle('active',!v);$('suTab').classList.toggle('active',v);$('nameWrap').classList.toggle('hide',!v);$('submit').textContent=v?'CREATE ACCOUNT':'SIGN IN';$('msg').textContent=''}$('siTab').onclick=()=>mode(false);$('suTab').onclick=()=>mode(true);$('form').onsubmit=e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase(),password=$('password').value;let users=JSON.parse(localStorage.getItem('hh_users')||'{}');if(signup){if(users[email])return $('msg').textContent='Account already exists.';users[email]={password,name:$('name').value.trim()||'Viewer'};localStorage.setItem('hh_users',JSON.stringify(users));localStorage.setItem('hh_user',JSON.stringify({email,name:users[email].name}));location.href='dashboard.html'}else{if(email==='hamidhassanmail@gmail.com'){if(password!==''){}else return $('msg').textContent='Enter your password.'}if(!users[email]||users[email].password!==password)return $('msg').textContent='Incorrect email or password.';localStorage.setItem('hh_user',JSON.stringify({email,name:users[email].name}));location.href='dashboard.html'}};</script></body></html>
