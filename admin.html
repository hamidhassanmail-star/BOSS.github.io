<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAMID HASSAN BOSS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#ff2aa6;--u:#7c4dff;--c:#00eaff;--g:#ffd43b}*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Arial;background:linear-gradient(135deg,#050713,#21052f,#032c3b);min-height:100vh}.wrap{max-width:1000px;width:92%;margin:auto;padding:40px 0}.panel{background:#0c1224eF;border:1px solid #fff2;border-radius:24px;padding:25px;margin-bottom:20px;box-shadow:0 20px 50px #0008}.logo{font-size:22px;font-weight:1000;background:linear-gradient(90deg,var(--c),#fff,var(--p),var(--g));-webkit-background-clip:text;color:transparent}.input,.file{width:100%;padding:14px;margin:7px 0 14px;border-radius:12px;border:1px solid #fff3;background:#050817;color:#fff;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.btn{border:0;border-radius:24px;padding:12px 18px;color:#fff;font-weight:900;background:linear-gradient(90deg,var(--p),var(--u));cursor:pointer}.secondary{background:#334155}.danger{background:#9d174d}.hidden{display:none}.hint{color:#cbd5e1;line-height:1.6}.success{color:#59ff83;font-weight:800}.row{display:flex;gap:12px;align-items:center;border-top:1px solid #fff2;padding:15px 0}.row img{width:90px;height:65px;object-fit:cover;border-radius:10px}.info{flex:1}.info small{display:block;color:#aeb8ca;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div id="login" class="panel"><h1>🔐 Admin Login</h1><p class="hint">Private posting dashboard for HAMID HASSAN BOSS.</p><input id="email" class="input" type="email" placeholder="Admin email"><input id="pass" class="input" type="password" placeholder="Password"><button class="btn" id="loginBtn">Sign in</button><p id="loginMsg" class="hint"></p></div><div id="app" class="hidden"><div class="actions" style="justify-content:space-between;margin-bottom:20px"><div class="logo">HAMID HASSAN BOSS • ADMIN</div><div class="actions"><a class="btn" href="posts.html">View posts</a><button class="btn" id="logout">Logout</button></div></div><section class="panel"><h2 id="heading">➕ Add New Post</h2><div class="grid"><div><label>Title</label><input id="title" class="input" placeholder="Post title"></div><div><label>Upload photo</label><input id="file" class="file" type="file" accept="image/*"></div></div><label>Description</label><textarea id="desc" class="input" rows="5" placeholder="Write your post..."></textarea><div class="grid"><div><label>YouTube URL</label><input id="yt" class="input" placeholder="https://youtube.com/watch?v=..."></div><div><label>Link URL</label><input id="link" class="input" placeholder="https://..."></div></div><label><input id="published" type="checkbox" checked> Publish now</label><div class="actions" style="margin-top:18px"><button class="btn" id="save">Publish Post</button><button class="btn secondary hidden" id="cancel">Cancel edit</button></div><p id="msg" class="hint"></p></section><section class="panel"><h2>📝 Manage Posts</h2><div id="list" class="hint">Loading…</div></section></div></main><script>
const URL='YOUR_SUPABASE_URL',KEY='YOUR_SUPABASE_ANON_KEY',ADMIN='hamidhassanmail@gmail.com';let sb,editId=null;const $=x=>document.getElementById(x);const configured=URL.startsWith('https://')&&KEY.length>20;function msg(t,ok=false){$('msg').textContent=t;$('msg').className=ok?'success':'hint'}
async function boot(){if(!configured){$('loginMsg').textContent='Supabase is not connected. Add your project URL and anon key in this file.';return}sb=supabase.createClient(URL,KEY);let {data}=await sb.auth.getSession();if(data.session)enter(data.session.user)}function enter(u){if((u.email||'').toLowerCase()!==ADMIN){sb.auth.signOut();$('loginMsg').textContent='This account is not authorized.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
$('loginBtn').onclick=async()=>{if(!sb)return;let {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(error){$('loginMsg').textContent=error.message;return}enter(data.user)};$('logout').onclick=()=>sb.auth.signOut().then(()=>location.reload());
async function imageUrl(){let f=$('file').files[0];if(!f)return null;let name=f.name.replace(/[^a-zA-Z0-9._-]/g,'-'),path='posts/'+Date.now()+'-'+name;let {error}=await sb.storage.from('post-images').upload(path,f,{contentType:f.type});if(error)throw error;return sb.storage.from('post-images').getPublicUrl(path).data.publicUrl}
$('save').onclick=async()=>{if(!$('title').value.trim())return msg('Enter a title.');msg(editId?'Updating…':'Uploading and publishing…');try{let image=await imageUrl();let row={title:$('title').value.trim(),description:$('desc').value.trim(),youtube_url:$('yt').value.trim()||null,link_url:$('link').value.trim()||null,published:$('published').checked};if(image)row.image_url=image;let r=editId?await sb.from('posts').update(row).eq('id',editId):await sb.from('posts').insert(row);if(r.error)throw r.error;msg(editId?'Post updated!':'Post published!',true);reset();load()}catch(e){msg(e.message)}};
function reset(){editId=null;$('title').value='';$('desc').value='';$('yt').value='';$('link').value='';$('file').value='';$('published').checked=true;$('heading').textContent='➕ Add New Post';$('save').textContent='Publish Post';$('cancel').classList.add('hidden')}$('cancel').onclick=reset;
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}async function load(){let {data,error}=await sb.from('posts').select('*').order('created_at',{ascending:false});if(error)return $('list').textContent=error.message;if(!data.length)return $('list').textContent='No posts yet.';$('list').innerHTML=data.map(p=>`<div class="row">${p.image_url?`<img src="${esc(p.image_url)}">`:''}<div class="info"><b>${esc(p.title)}</b><small>${p.published?'Published':'Draft'} • ${new Date(p.created_at).toLocaleString()}</small></div><div class="actions"><button class="btn secondary" onclick="editPost('${p.id}')">Edit</button><button class="btn danger" onclick="delPost('${p.id}')">Delete</button></div></div>`).join('')}
window.editPost=async id=>{let {data,error}=await sb.from('posts').select('*').eq('id',id).single();if(error)return alert(error.message);editId=id;$('title').value=data.title||'';$('desc').value=data.description||'';$('yt').value=data.youtube_url||'';$('link').value=data.link_url||'';$('published').checked=!!data.published;$('heading').textContent='✏️ Edit Post';$('save').textContent='Save Changes';$('cancel').classList.remove('hidden');scrollTo(0,0)};window.delPost=async id=>{if(!confirm('Delete this post?'))return;let {error}=await sb.from('posts').delete().eq('id',id);if(error)alert(error.message);load()};boot();
</script></body></html>
