<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMID HASSAN BOSS | Posts</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--pink:#ff2aa6;--purple:#7c4dff;--cyan:#00eaff;--gold:#ffd43b;--bg:#050713;--muted:#cbd5e1}*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Arial,sans-serif;background:radial-gradient(circle at 10% 10%,#00eaff22,transparent 25%),radial-gradient(circle at 90% 20%,#ff2aa622,transparent 25%),linear-gradient(135deg,#050713,#17052a,#041d2b);min-height:100vh}header{position:sticky;top:0;z-index:10;background:#02030ded;backdrop-filter:blur(15px);border-bottom:1px solid #ffffff20;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px}.logo{font-size:22px;font-weight:1000;letter-spacing:2px;background:linear-gradient(90deg,var(--cyan),#fff,var(--pink),var(--gold));-webkit-background-clip:text;color:transparent}.back{padding:11px 18px;border-radius:25px;background:linear-gradient(90deg,var(--pink),var(--purple));font-weight:900;text-decoration:none;color:#fff}.wrap{width:min(1180px,92%);margin:auto;padding:65px 0}.hero{text-align:center;margin-bottom:45px}.hero h1{font-size:clamp(42px,7vw,78px);margin:0 0 10px}.hero h1 span{background:linear-gradient(90deg,var(--gold),var(--pink),var(--cyan));-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.post{background:linear-gradient(145deg,#11182de8,#29103be8);border:1px solid #ffffff22;border-radius:25px;overflow:hidden;box-shadow:0 20px 55px #0008}.post img{width:100%;height:220px;object-fit:cover;display:block;background:#101827}.body{padding:20px}.body h2{margin:0 0 10px;font-size:24px}.body p{color:var(--muted);line-height:1.65;white-space:pre-wrap}.date{font-size:12px;color:var(--cyan);font-weight:800}.video{position:relative;padding-top:56.25%;margin-top:15px}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:15px}.link{display:inline-block;margin-top:12px;color:var(--gold);font-weight:800}.empty,.error{padding:35px;text-align:center;border:1px dashed #ffffff35;border-radius:22px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){header{padding:13px 4%}.logo{font-size:16px}.wrap{padding:40px 0}.grid{grid-template-columns:1fr}.post img{height:210px}}
</style></head>
<body>
<header><a class="logo" href="index.html">HAMID HASSAN BOSS</a><a class="back" href="index.html">← Home</a></header>
<main class="wrap"><div class="hero"><h1>Latest <span>Posts</span></h1><p>Photos, videos, stories, motivation and updates from HAMID HASSAN.</p></div><div id="feed" class="grid"><div class="empty">Loading posts…</div></div></main>
<script>
const SUPABASE_URL='YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
const feed=document.getElementById('feed');
function ready(){return SUPABASE_URL.startsWith('https://')&&SUPABASE_ANON_KEY.length>20}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function yt(url){try{let u=new URL(url);let id=u.searchParams.get('v');if(!id&&u.hostname.includes('youtu.be'))id=u.pathname.slice(1);if(!id&&u.pathname.includes('/shorts/'))id=u.pathname.split('/shorts/')[1].split('/')[0];return id?`https://www.youtube.com/embed/${encodeURIComponent(id)}`:''}catch{return ''}}
async function load(){if(!ready()){feed.innerHTML='<div class="error" style="grid-column:1/-1">The posting system is installed, but Supabase is not connected yet. Add your Supabase URL and anon key in posts.html and admin.html.</div>';return}const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data,error}=await sb.from('posts').select('*').eq('published',true).order('created_at',{ascending:false});if(error){feed.innerHTML='<div class="error" style="grid-column:1/-1">Could not load posts. Check the Supabase table and security policies.</div>';return}if(!data?.length){feed.innerHTML='<div class="empty" style="grid-column:1/-1">No published posts yet. Your admin dashboard can publish the first one.</div>';return}feed.innerHTML=data.map(p=>{const video=yt(p.youtube_url);return `<article class="post">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.title)}" loading="lazy">`:''}<div class="body"><div class="date">${new Date(p.created_at).toLocaleDateString()}</div><h2>${esc(p.title)}</h2>${p.description?`<p>${esc(p.description)}</p>`:''}${video?`<div class="video"><iframe src="${video}" title="${esc(p.title)}" loading="lazy" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe></div>`:''}${p.link_url?`<a class="link" href="${esc(p.link_url)}" target="_blank" rel="noopener">🔗 Open link</a>`:''}</div></article>`}).join('')}
load();
</script></body></html>
