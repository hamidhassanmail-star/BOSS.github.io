<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Read the latest stories, creator updates and ideas from THE BOSS by Hamid Hassan.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#f26a21">
<meta property="og:type" content="website">
<meta property="og:title" content="THE BOSS Journal | Hamid Hassan">
<meta property="og:description" content="Stories, updates and useful ideas from THE BOSS.">
<link rel="canonical" href="https://hamidhassanmail-star.github.io/BOSS.github.io/posts.html">
<link rel="icon" href="boss-favicon.svg" type="image/svg+xml">
<title>THE BOSS Journal | Hamid Hassan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="boss-theme.css?v=7">
<style>
*{box-sizing:border-box}body{background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}
.journal-top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px max(22px,calc((100vw - 1240px)/2));border-bottom:1px solid var(--line);background:#fffaf5}
.journal-logo{font-weight:950;letter-spacing:2px;color:var(--ink)}.journal-logo span{color:var(--orange)}
.journal-main{max-width:1240px;margin:auto;padding:58px 24px 90px}.journal-hero{padding:44px;border-radius:12px 52px 12px 12px;background:linear-gradient(120deg,#fff 0 66%,#ffead9 66%);border:1px solid var(--line)}
.journal-hero .eyebrow{color:var(--orange-deep);font-size:11px;letter-spacing:2px;font-weight:950}
.journal-hero h1{margin:14px 0;font-size:clamp(38px,7vw,72px);letter-spacing:-3px;line-height:1.02}.journal-hero h1 span{color:var(--orange)}
.journal-hero p{max-width:720px;color:var(--muted);line-height:1.8}
.journal-tools{display:flex;gap:12px;margin:30px 0 22px}.journal-tools input{flex:1;min-width:0;padding:14px 16px;border:1px solid #e8c9b4;border-radius:9px;background:#fff;color:#202733;font:inherit}
.journal-feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.post-card{overflow:hidden;border:1px solid var(--line);border-radius:10px 24px 10px 10px;background:#fff;box-shadow:0 12px 32px #3b1c0b0a}
.post-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee4dc}
.post-body{padding:20px}.post-date{font-size:10px;color:var(--orange-deep);letter-spacing:1.4px;font-weight:950}
.post-body h2{margin:10px 0;color:var(--ink);font-size:21px;line-height:1.35}.post-body p{color:#68717d;font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.post-video{position:relative;padding-top:56.25%;margin-top:14px}.post-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}
.post-link{display:inline-flex;margin-top:12px;color:var(--orange-deep);font-weight:900;font-size:13px}
.feed-message{grid-column:1/-1;padding:32px;border:1px dashed #e5b18f;border-radius:12px;background:#fffaf6;color:#68717d;text-align:center}
.load-more{display:block;margin:28px auto 0}
html[data-theme="dark"] body{background:var(--night);color:#eef2f7}
html[data-theme="dark"] .journal-top{background:#101824;border-color:#283547}
html[data-theme="dark"] .journal-logo{color:#f4f5f7}
html[data-theme="dark"] .journal-hero,html[data-theme="dark"] .post-card{background:#171f2b;border-color:#2b394b}
html[data-theme="dark"] .journal-hero h1,html[data-theme="dark"] .post-body h2{color:#f4f5f7}
html[data-theme="dark"] .journal-hero p,html[data-theme="dark"] .post-body p{color:#aeb9c8}
html[data-theme="dark"] .journal-tools input{background:#0e1621;border-color:#354456;color:#f4f6f8}
html[data-theme="dark"] .feed-message{background:#141d29;border-color:#80502f;color:#aeb9c8}
@media(max-width:900px){.journal-feed{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.journal-main{padding:28px 16px 60px}.journal-hero{padding:28px 20px;border-radius:10px 32px 10px 10px}.journal-feed{grid-template-columns:1fr}.journal-tools{flex-direction:column}.journal-top{padding:14px 16px}}
</style>
</head>
<body>
<header class="journal-top"><a class="journal-logo" href="index.html">THE <span>BOSS</span></a><a class="btn" href="index.html">← BACK TO HOME</a></header>
<main class="journal-main">
<section class="journal-hero"><span class="eyebrow">THE BOSS JOURNAL</span><h1>Stories. Ideas.<br><span>New Perspectives.</span></h1><p>Discover creator updates, meaningful stories and useful ideas. Posts are published through a private, secure content dashboard.</p></section>
<div class="journal-tools"><input id="postSearch" type="search" placeholder="Search journal posts…" aria-label="Search journal posts"><a class="btn" href="index.html#journal">LATEST ON HOME</a></div>
<section class="journal-feed" id="feed" aria-live="polite"><div class="feed-message">Loading posts…</div></section>
<button id="loadMore" class="btn load-more" type="button" hidden>LOAD MORE</button>
</main>
<footer class="footer">© 2026 <b>HAMID HASSAN | THE BOSS</b> — All Rights Reserved</footer>
<script>
(function(){
 const URL='https://kjeqoobfuaspwcbcoxuu.supabase.co';
 const KEY='sb_publishable_j8Au2s35gx0DV5mBLP046w_oAgnvth4';
 const client=window.supabase.createClient(URL,KEY);
 const feed=document.getElementById('feed'),more=document.getElementById('loadMore'),search=document.getElementById('postSearch');
 const pageSize=18;let offset=0,allPosts=[],busy=false,finished=false;
 function safeUrl(value){try{const u=new URL(value);return u.protocol==='https:'?u.href:''}catch(_){return ''}}
 function ytId(value){try{const u=new URL(value);let id='';if(u.hostname==='youtu.be')id=u.pathname.slice(1);else if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname)){id=u.searchParams.get('v')||((u.pathname.match(/^\/(?:shorts|live|embed)\/([^/]+)/)||[])[1]||'')}return /^[A-Za-z0-9_-]{11}$/.test(id)?id:''}catch(_){return ''}}
 function showMessage(message){const box=document.createElement('div');box.className='feed-message';box.textContent=message;feed.replaceChildren(box)}
 function buildCard(post){
  const article=document.createElement('article');article.className='post-card';
  const imageUrl=safeUrl(post.image_url)||(ytId(post.youtube_url)?'https://i.ytimg.com/vi/'+ytId(post.youtube_url)+'/hqdefault.jpg':'');
  if(imageUrl){const img=document.createElement('img');img.src=imageUrl;img.alt=post.title||'Post image';img.loading='lazy';img.decoding='async';article.appendChild(img)}
  const body=document.createElement('div');body.className='post-body';
  const date=document.createElement('div');date.className='post-date';date.textContent=post.created_at?new Date(post.created_at).toLocaleDateString('en-LK',{year:'numeric',month:'short',day:'numeric'}):'THE BOSS JOURNAL';
  const title=document.createElement('h2');title.textContent=post.title||'Untitled post';
  const description=document.createElement('p');description.textContent=post.description||'';
  body.append(date,title,description);
  const id=ytId(post.youtube_url);
  if(id){const wrap=document.createElement('div');wrap.className='post-video';const iframe=document.createElement('iframe');iframe.src='https://www.youtube-nocookie.com/embed/'+id;iframe.title=post.title||'YouTube video';iframe.loading='lazy';iframe.referrerPolicy='strict-origin-when-cross-origin';iframe.allow='accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share';iframe.allowFullscreen=true;wrap.appendChild(iframe);body.appendChild(wrap)}
  const link=safeUrl(post.link_url);
  if(link){const a=document.createElement('a');a.className='post-link';a.href=link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open related link ↗';body.appendChild(a)}
  article.appendChild(body);return article;
 }
 function render(){const q=search.value.trim().toLocaleLowerCase();const filtered=allPosts.filter(p=>(p.title+' '+(p.description||'')).toLocaleLowerCase().includes(q));feed.replaceChildren();if(!filtered.length){showMessage(q?'No posts match this search.':'No published posts yet. Please check back soon.');return}filtered.forEach(p=>feed.appendChild(buildCard(p)))}
 async function load(){if(busy||finished)return;busy=true;more.disabled=true;more.hidden=false;more.textContent='LOADING…';
  const {data,error}=await client.from('posts').select('id,title,description,image_url,youtube_url,link_url,created_at').eq('published',true).order('created_at',{ascending:false}).range(offset,offset+pageSize-1);
  if(error){showMessage('The journal is temporarily unavailable. Please try again later.');more.hidden=true;busy=false;return}
  const batch=data||[];allPosts=allPosts.concat(batch);offset+=batch.length;finished=batch.length<pageSize;render();more.hidden=finished;more.disabled=false;more.textContent='LOAD MORE';busy=false;
 }
 search.addEventListener('input',render);more.addEventListener('click',load);load();
})();
</script>
</body></html>
